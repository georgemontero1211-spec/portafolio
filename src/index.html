<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>George Montero · Desarrollador de Software</title>
  <meta name="description" content="Portafolio de George Montero Nuñez, desarrollador de software backend .NET y full-stack con React y TypeScript.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8FAFC">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplica tema e idioma guardados antes de que cargue Angular (evita el destello) -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('lang');
        if (lang !== 'es' && lang !== 'en') {
          lang = (navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
        }
        root.lang = lang;
      } catch (e) {
        root.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
